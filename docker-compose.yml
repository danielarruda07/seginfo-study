# Deploy da SegInfo Study no Coolify (VM100 10.10.10.99, Proxmox pm02).
# O Coolify lê este compose, builda as imagens e publica o serviço `web`.
# O Cloudflare Tunnel aponta estudo.criecom.ia.br -> container web (porta 80).
services:
  # Nome único (não `api`): a API também entra na rede compartilhada `coolify`
  # para alcançar o Postgres, e um nome genérico poderia colidir no DNS com outras apps.
  seginfo-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      # mesma origem em produção (Nginx faz o proxy /api): CORS não é usado pelo browser.
      - WEB_ORIGIN=https://estudo.criecom.ia.br
      # Secrets definidos no Coolify. NÃO comite valores reais:
      #   DATABASE_URL=postgresql://seginfo_app:SENHA@lgrzsnhe4pycyjjsoyk7f3hi:5432/seginfo_study?schema=public
      - DATABASE_URL=${DATABASE_URL}
      # Verificação do JWT do Cloudflare Access (sem isso a API recusa tudo em produção)
      - CF_ACCESS_TEAM=${CF_ACCESS_TEAM}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD}
      # Radar de Ataques: token dos coletores e dono dos eventos (sem eles a ingestão responde 503)
      - INGEST_TOKEN=${INGEST_TOKEN}
      - INGEST_OWNER_EMAIL=${INGEST_OWNER_EMAIL}
      # Service Token do Access para a ingestão (app `estudo-ingest`)
      - CF_ACCESS_INGEST_AUD=${CF_ACCESS_INGEST_AUD}
      - CF_ACCESS_INGEST_CLIENT_ID=${CF_ACCESS_INGEST_CLIENT_ID}
      # opcionais (valores padrão seguros)
      - RADAR_GUARDAR_SENHAS=${RADAR_GUARDAR_SENHAS:-false}
      - ATAQUES_RETENCAO_DIAS=${ATAQUES_RETENCAO_DIAS:-90}
      # Armazenamento externo (OneDrive pessoal) e backups cifrados. Ver docs/ARMAZENAMENTO.md
      # Não é segredo: já vem preenchida aqui, sem precisar configurar no Coolify.
      # Só defina a variável no Coolify se o domínio mudar.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://estudo.criecom.ia.br}
      - MS_CLIENT_ID=${MS_CLIENT_ID}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET}
      - STORAGE_TOKEN_KEY=${STORAGE_TOKEN_KEY}
      - BACKUP_PUBLIC_KEY_B64=${BACKUP_PUBLIC_KEY_B64}
      - BACKUP_AUTOMATICO=${BACKUP_AUTOMATICO:-false}
      - BACKUP_RETENCAO=${BACKUP_RETENCAO:-14}
      # IA do módulo LinkedIn (Claude API). Secret no Coolify; sem ela a IA fica desligada.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Opcional: trocar o modelo principal (rascunho completo, planejador, agentes) e o das
      # tarefas curtas (refinar texto, organizar posts). Vazio = padrão do código.
      - IA_MODELO=${IA_MODELO:-}
      - IA_MODELO_RAPIDO=${IA_MODELO_RAPIDO:-}
      # Ilustração por IA nos posts do LinkedIn (Gemini API, opcional). Secret no Coolify; sem ela,
      # a arte sai só com os templates. Os IDs de modelo mudam: vazio = padrão do código.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODELO_RAPIDO=${GEMINI_MODELO_RAPIDO:-}
      - GEMINI_MODELO_QUALIDADE=${GEMINI_MODELO_QUALIDADE:-}
      - IMAGEM_LIMITE_DIARIO=${IMAGEM_LIMITE_DIARIO:-30}
      # LinkedIn: publicar pelo servidor (docs/LINKEDIN.md). Secrets do app criado em
      # developers.linkedin.com; usa também PUBLIC_BASE_URL e STORAGE_TOKEN_KEY (acima).
      # Sem elas, o agendamento funciona como lembrete e você publica à mão.
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      # Opcionais: fuso do calendário editorial, versão da API (AAAAMM) e domínios próprios que o
      # servidor nunca deixa sair num post (separados por vírgula).
      - LINKEDIN_FUSO=${LINKEDIN_FUSO:-America/Fortaleza}
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-}
      - LINKEDIN_DOMINIOS_BLOQUEADOS=${LINKEDIN_DOMINIOS_BLOQUEADOS:-}
      # Agents: ferramentas do Proxmox (docs/AGENTS.md). Sem elas, as ferramentas avisam que falta configurar.
      #   PROXMOX_URL=https://ENDERECO:8006   PROXMOX_TOKEN=usuario@realm!nome=segredo (Secret)
      #   PROXMOX_CA_B64=pve-root-ca.pem em base64 (recomendado)  ou  PROXMOX_TLS_INSEGURO=true (só laboratório)
      - PROXMOX_URL=${PROXMOX_URL}
      - PROXMOX_TOKEN=${PROXMOX_TOKEN}
      - PROXMOX_CA_B64=${PROXMOX_CA_B64}
      - PROXMOX_TLS_INSEGURO=${PROXMOX_TLS_INSEGURO:-false}
      # VMIDs que nenhum agente pode apagar (ex.: a VM do proprio app), separados por virgula
      - PROXMOX_VMS_PROTEGIDAS=${PROXMOX_VMS_PROTEGIDAS:-}
      # Agents: ferramentas do FortiGate (docs/AGENTS.md). Token de um admin REST API dedicado.
      #   FORTIGATE_URL=https://ENDERECO:PORTA   FORTIGATE_TOKEN=token do admin REST API (Secret)
      - FORTIGATE_URL=${FORTIGATE_URL}
      - FORTIGATE_TOKEN=${FORTIGATE_TOKEN}
      - FORTIGATE_TLS_INSEGURO=${FORTIGATE_TLS_INSEGURO:-false}
      # Wazuh: saúde do manager/agentes e operações aprovadas nos Agents (docs/WAZUH.md).
      - WAZUH_API_URL=${WAZUH_API_URL}
      - WAZUH_API_USERNAME=${WAZUH_API_USERNAME}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      - WAZUH_API_CA_B64=${WAZUH_API_CA_B64}
      - WAZUH_API_TLS_INSEGURO=${WAZUH_API_TLS_INSEGURO:-false}
      # Zabbix: API JSON-RPC para consultas e operações aprovadas nos Agents (docs/AGENTS.md).
      - ZABBIX_API_URL=${ZABBIX_API_URL}
      - ZABBIX_API_TOKEN=${ZABBIX_API_TOKEN}
      - ZABBIX_CA_B64=${ZABBIX_CA_B64}
      - ZABBIX_TLS_INSEGURO=${ZABBIX_TLS_INSEGURO:-false}
      # Agents: ferramentas do Catalyst 2960, por SSH (docs/AGENTS.md). Senha OU chave privada.
      #   CATALYST_HOST=IP do switch   CATALYST_USER=usuario   CATALYST_PASSWORD=senha (Secret)
      - CATALYST_HOST=${CATALYST_HOST}
      - CATALYST_PORT=${CATALYST_PORT:-22}
      - CATALYST_USER=${CATALYST_USER}
      - CATALYST_PASSWORD=${CATALYST_PASSWORD}
      - CATALYST_PRIVATE_KEY_B64=${CATALYST_PRIVATE_KEY_B64}
      # senha de "enable" (se o usuário não entra direto em modo privilegiado) e a impressão digital
      # SHA256 da chave SSH do switch (o "Testar conexão" mostra o valor a fixar)
      - CATALYST_ENABLE_PASSWORD=${CATALYST_ENABLE_PASSWORD:-}
      - CATALYST_HOST_KEY_SHA256=${CATALYST_HOST_KEY_SHA256:-}
      # Wazuh: indexador (alertas, porta 9200). Usuário com leitura em wazuh-alerts-*.
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-}
      - WAZUH_INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:-}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-}
      - WAZUH_INDEXER_CA_B64=${WAZUH_INDEXER_CA_B64:-}
      - WAZUH_INDEXER_TLS_INSEGURO=${WAZUH_INDEXER_TLS_INSEGURO:-false}
      # Coolify: listar, reiniciar e fazer deploy pelos agentes. URL vista de dentro do container.
      - COOLIFY_URL=${COOLIFY_URL:-}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN:-}
      - COOLIFY_TLS_INSEGURO=${COOLIFY_TLS_INSEGURO:-false}
      - SPIDERFOOT_URL=${SPIDERFOOT_URL:-}
      - SPIDERFOOT_USERNAME=${SPIDERFOOT_USERNAME:-}
      - SPIDERFOOT_PASSWORD=${SPIDERFOOT_PASSWORD:-}
      - SPIDERFOOT_TLS_INSEGURO=${SPIDERFOOT_TLS_INSEGURO:-false}
      - EXPOSICAO_INTERVALO_HORAS=${EXPOSICAO_INTERVALO_HORAS:-24}
      # Minha exposição: chaves opcionais das fontes extras e destinos dos alertas
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET:-}
      - CENSYS_API_TOKEN=${CENSYS_API_TOKEN:-}
      - HIBP_API_KEY=${HIBP_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY:-}
      - VT_API_KEY=${VT_API_KEY:-}
      - WAZUH_SYSLOG_HOST=${WAZUH_SYSLOG_HOST:-}
      - WAZUH_SYSLOG_PORT=${WAZUH_SYSLOG_PORT:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - EXPOSICAO_TELEGRAM_MIN=${EXPOSICAO_TELEGRAM_MIN:-}
      # MCP do homelab (/api/mcp): token próprio + aplicação Access só do caminho, com Service Token.
      # MCP_DESTRUTIVAS=bloquear desliga pelo MCP as ações destrutivas (apagar, reverter, desligar à força).
      - MCP_TOKEN=${MCP_TOKEN:-}
      - MCP_OWNER_EMAIL=${MCP_OWNER_EMAIL:-}
      - CF_ACCESS_MCP_AUD=${CF_ACCESS_MCP_AUD:-}
      - CF_ACCESS_MCP_CLIENT_ID=${CF_ACCESS_MCP_CLIENT_ID:-}
      - MCP_DESTRUTIVAS=${MCP_DESTRUTIVAS:-permitir}
      # Agents: controle de custo diário (docs/AGENTS.md). Opcional; sem definir, usa os padrões (60 e 30).
      - AGENTES_LIMITE_DIARIO_EXECUCOES=${AGENTES_LIMITE_DIARIO_EXECUCOES:-60}
      - AGENTES_LIMITE_DIARIO_ESCRITAS=${AGENTES_LIMITE_DIARIO_ESCRITAS:-30}
      # chamadas ao modelo e tokens de saída por pedido (tarefas que cruzam vários sistemas)
      - AGENTES_LIMITE_VOLTAS=${AGENTES_LIMITE_VOLTAS:-24}
      - AGENTES_LIMITE_TOKENS_SAIDA=${AGENTES_LIMITE_TOKENS_SAIDA:-100000}
    expose:
      - "3001"
    # `default`: rede privada do compose (web -> api).
    # `coolify`: rede onde estão os Postgres (acesso ao banco pelo nome do container).
    networks:
      - default
      - coolify
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - seginfo-api
    # O Coolify injeta a porta/label do proxy. Para teste local, descomente:
    # ports:
    #   - "8080:80"
    restart: unless-stopped

networks:
  coolify:
    external: true
