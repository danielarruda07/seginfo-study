server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cabeçalhos de segurança básicos (o front é um SPA estático)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /api/ingest (coletores) passa por este proxy como o resto de /api/, mas a borda do
    # Cloudflare Access a protege com uma aplicação própria (Service Auth) e a API
    # revalida o JWT e exige o X-Ingest-Token. Ver docs/RADAR.md.

    # API: encaminha para o container seginfo-api (mesma origem → sem CORS no browser).
    # Resolver + variável: o nginx resolve o nome na hora do request, então não falha
    # ao iniciar se a API ainda estiver subindo. O URI original (/api/...) é preservado.
    location /api/ {
        # Amostras: até 8 MB codificados em base64; a API limita cada rota.
        client_max_body_size 12m;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://seginfo-api:3001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Geração de conteúdo com IA pode levar mais que as rotas CRUD; manter
        # abaixo do timeout padrão de leitura do proxy Cloudflare (125 s).
        proxy_read_timeout 110s;
    }

    # LinkedIn: arquivo do post (imagem até 8 MB, PDF até 20 MB) enviado cru. A API limita a rota.
    location ~ ^/api/linkedin/rascunhos/[^/]+/midia$ {
        client_max_body_size 25m;
        resolver 127.0.0.11 valid=10s;
        set $upstream http://seginfo-api:3001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 110s;
    }

    # SPA: qualquer rota cai no index.html (TanStack Router client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache de assets com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
