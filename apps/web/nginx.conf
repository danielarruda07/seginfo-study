server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cabeçalhos de segurança básicos (o front é um SPA estático)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: encaminha para o container seginfo-api (mesma origem → sem CORS no browser).
    # Resolver + variável: o nginx resolve o nome na hora do request, então não falha
    # ao iniciar se a API ainda estiver subindo. O URI original (/api/...) é preservado.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://seginfo-api:3001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: qualquer rota cai no index.html (TanStack Router client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache de assets com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
