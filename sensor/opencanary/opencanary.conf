  "mssql.enabled": true,
  "mssql.port": 1433,
  "mssql.version": "2012",
  "mysql.enabled": false,
  "ntp.enabled": false,
  "portscan.enabled": false,
  "rdp.enabled": true,
  "rdp.port": 3389,
  "redis.enabled": false,
  "sip.enabled": false,
  "smb.enabled": false,
  "snmp.enabled": false,
  "ssh.enabled": false,
  "tcpbanner.enabled": false,
  "telnet.enabled": false,
  "tftp.enabled": false,
  "vnc.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
