<!-- /var/ossec/etc/shared/range-isca-web/agent.conf (grupo do agente da isca web) -->
<agent_config>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/isca-web/access.log</location>
  </localfile>
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="no">/srv/isca/wp</directories>
    <ignore type="sregex">/wp-content/cache/|/wp-content/upgrade/</ignore>
    <directories realtime="yes" check_all="yes">/opt/isca-web</directories>
  </syscheck>
</agent_config>
